[package]
name = "hbt-server"
version = "2.0.3"
edition = "2021"

[dependencies]
hbt-proto.workspace = true
serde.workspace = true
httparse = "1"
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rand.workspace = true
serde_json = "1.0.154"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "form"] }
maud = { version = "0.27.0", features = ["axum"] }
argon2 = "0.6.0"
thiserror.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio", "service", "server"] }
x509-parser = "0.18.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "native-tokio", "tls12", "logging"] }
http-body-util = "0.1.5"

[lints]
workspace = true

[dev-dependencies]
rcgen = "0.14"
