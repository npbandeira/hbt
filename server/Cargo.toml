[package]
name = "hbt-server"
version = "0.1.1"
edition = "2021"

[dependencies]
hbt-proto.workspace = true
serde.workspace = true
httparse = "1"
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rand.workspace = true
serde_json = "1.0.154"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "form"] }
maud = { version = "0.27.0", features = ["axum"] }
argon2 = "0.6.0"
thiserror.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }

[lints]
workspace = true
